<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Currículo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Gerador de Currículo</h1>

  <div>
    <input type="text" id="input-nome" placeholder="Nome completo">
    <input type="text" id="input-objetivo" placeholder="Objetivo (ex: Estágio em TI)">
    <textarea id="input-experiencia" placeholder="Experiência profissional"></textarea>
    <textarea id="input-habilidades" placeholder="Habilidades (separadas por vírgula)"></textarea>
    <button id="botao-gerar">Gerar Currículo</button>
  </div>

  <div id="resultado-curriculo"></div>

  <script src="script-curriculo.js"></script>
</body>
</html>
